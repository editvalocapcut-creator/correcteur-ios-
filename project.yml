name: Correcteur
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Correcteur:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Correcteur IA
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.correcteur]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.correcteur
    dependencies:
      - target: CorrecteurKeyboard
  CorrecteurKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Correcteur IA
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrimaryLanguage: fr-FR
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.correcteur]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.correcteur.keyboard
